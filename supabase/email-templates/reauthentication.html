<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Verificá tu identidad</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f4f5f7;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; background-color:#ffffff; border-radius:12px;">
            <tr>
              <td style="padding:40px 40px 24px 40px;" align="left">
                <img
                  src="{{ .SiteURL }}/brand/perhaps-logo_low.png"
                  width="150"
                  height="47"
                  alt="Planner by Perhaps"
                  style="display:block; border:0; outline:none; text-decoration:none; max-width:150px;"
                />
                <div style="margin-top:10px; font-family:Arial, Helvetica, sans-serif; font-size:13px; color:#6b7280;">
                  Ideas en orden. Contenido en movimiento.
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 40px 0 40px;" align="left">
                <h1 style="margin:0 0 16px 0; font-family:Arial, Helvetica, sans-serif; font-size:24px; line-height:1.3; color:#111827; font-weight:700;">
                  Verificá tu identidad
                </h1>
                <p style="margin:0 0 28px 0; font-family:Arial, Helvetica, sans-serif; font-size:14px; line-height:1.6; color:#4b5563;">
                  Usá el siguiente código para confirmar que sos vos. Vence en pocos minutos.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 28px 0;">
                  <tr>
                    <td style="background-color:#f4f5f7; border-radius:10px; padding:18px 28px;">
                      <span style="font-family:Arial, Helvetica, sans-serif; font-size:28px; font-weight:700; letter-spacing:6px; color:#111827;">
                        {{ .Token }}
                      </span>
                    </td>
                  </tr>
                </table>
                <p style="margin:0 0 0 0; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:1.6; color:#9ca3af;">
                  Si no solicitaste este código, podés ignorar este email.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:32px 40px 32px 40px;" align="left">
                <hr style="border:none; border-top:1px solid #e5e7eb; margin:0 0 20px 0;" />
                <p style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:11px; color:#9ca3af;">
                  Planner
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
